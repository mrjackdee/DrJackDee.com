      @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/oxanium-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Oxanium'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/oxanium-latin-500-normal.woff2') format('woff2'); }
      :root { --bg: #FFFFFF; --ink: #111111; --muted: #4A4A4A; --line: #E4E4E4; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: var(--bg); color: var(--ink); font-family: 'Oxanium', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 32px 16px; -webkit-font-smoothing: antialiased; }

      .rule { width: 56px; height: 2px; background: var(--ink); margin: 28px auto; }
      p { font-size: clamp(16px, 2.4vw, 19px); line-height: 1.65; color: var(--muted); }
      a { color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
      a:hover, a:focus-visible { text-decoration-thickness: 2px; }
